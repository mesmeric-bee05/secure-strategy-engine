name: security-memory-drift

on:
  pull_request:
    paths:
      - "docs/security/**"
      - "tests/security/__fixtures__/**"
      - "supabase/migrations/**"
      - "scripts/check-security-memory-drift.ts"

permissions:
  contents: read
  pull-requests: write

jobs:
  drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run drift check
        id: drift
        continue-on-error: true
        run: bun scripts/check-security-memory-drift.ts

      - name: Post PR comment with drift report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/security-memory-drift.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) return;
            const marker = '<!-- security-memory-drift -->';
            const message = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: message });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: message });
            }

      - name: Fail if drift detected
        if: steps.drift.outcome == 'failure'
        run: exit 1
